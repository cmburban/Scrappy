<title>Scrappy</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a green cutting-mat hero where the corgi sits, over a clean paper-white marketplace.
   Brand: corgi orange (accent + primary actions), mat green (craft surface), warm neutrals. */
:root{
  --bg:oklch(98.6% .005 85); --surface:oklch(100% 0 0); --surface-2:oklch(96% .008 85);
  --ink:oklch(24% .02 60); --ink-2:oklch(47% .02 65); --line:oklch(90% .012 80); --edge:oklch(64% .02 70);
  --brand:oklch(72% .155 58); --brand-ink:oklch(22% .03 55); --brand-edge:oklch(55% .14 52);
  --brand-soft:oklch(94% .045 65); --brand-text:oklch(50% .14 50);
  --ok:oklch(45% .09 165); --ok-soft:oklch(94% .035 165);
  --swap:oklch(48% .13 265); --swap-soft:oklch(94% .025 265);
  --warn:oklch(46% .1 70); --warn-soft:oklch(95% .05 85); --muted-soft:oklch(94% .008 85);
  --danger:oklch(50% .17 28); --danger-bg:oklch(50% .17 28); --danger-bg-ink:oklch(99% 0 0);
  --focus:oklch(52% .17 255);
  --mat:oklch(46% .075 165); --mat-ink:oklch(97% .015 165); --mat-ink-2:oklch(86% .04 165); --mat-deep:oklch(34% .06 165);
  --mat-grid-a:rgba(255,255,255,.15); --mat-grid-b:rgba(255,255,255,.07); --mat-tick:rgba(255,255,255,.6);
  --fur:oklch(72% .15 58); --fur-deep:oklch(63% .15 52); --cream:oklch(97.5% .012 85); --outline:oklch(27% .045 50);
  --nose:oklch(24% .02 50); --ear-in:oklch(82% .08 45); --tongue:oklch(72% .14 15); --yarn:oklch(62% .17 330); --shade:rgba(0,0,0,.2);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:oklch(19% .012 60); --surface:oklch(23% .014 60); --surface-2:oklch(27% .015 60);
    --ink:oklch(94% .01 80); --ink-2:oklch(74% .015 75); --line:oklch(34% .015 65); --edge:oklch(56% .015 65);
    --brand:oklch(76% .15 60); --brand-ink:oklch(20% .03 55); --brand-edge:oklch(84% .12 65);
    --brand-soft:oklch(32% .06 55); --brand-text:oklch(80% .13 65);
    --ok:oklch(80% .11 165); --ok-soft:oklch(31% .05 165); --swap:oklch(80% .1 265); --swap-soft:oklch(30% .05 265);
    --warn:oklch(82% .11 80); --warn-soft:oklch(32% .06 80); --muted-soft:oklch(30% .012 60);
    --danger:oklch(76% .13 28); --danger-bg:oklch(72% .14 28); --danger-bg-ink:oklch(20% .03 28);
    --focus:oklch(78% .12 250); --mat:oklch(36% .06 165); --mat-deep:oklch(28% .05 165); --shade:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(19% .012 60); --surface:oklch(23% .014 60); --surface-2:oklch(27% .015 60);
  --ink:oklch(94% .01 80); --ink-2:oklch(74% .015 75); --line:oklch(34% .015 65); --edge:oklch(56% .015 65);
  --brand:oklch(76% .15 60); --brand-ink:oklch(20% .03 55); --brand-edge:oklch(84% .12 65);
  --brand-soft:oklch(32% .06 55); --brand-text:oklch(80% .13 65);
  --ok:oklch(80% .11 165); --ok-soft:oklch(31% .05 165); --swap:oklch(80% .1 265); --swap-soft:oklch(30% .05 265);
  --warn:oklch(82% .11 80); --warn-soft:oklch(32% .06 80); --muted-soft:oklch(30% .012 60);
  --danger:oklch(76% .13 28); --danger-bg:oklch(72% .14 28); --danger-bg-ink:oklch(20% .03 28);
  --focus:oklch(78% .12 250); --mat:oklch(36% .06 165); --mat-deep:oklch(28% .05 165); --shade:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-80px;z-index:60;padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:24px 56px;outline:none}
h1:focus{outline:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 6px 2px 0;min-height:48px;cursor:pointer;color:var(--ink);font:700 28px/1 var(--f-display);letter-spacing:-.035em;border-radius:10px}
.logo{width:44px;height:44px;flex:none}
#nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.nav-btn{display:inline-flex;align-items:center;background:none;border:0;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.nav-btn:hover,.nav-btn[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.nav-btn[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brand)}
.badge{display:inline-block;margin-left:6px;min-width:22px;padding:0 6px;border-radius:11px;background:var(--brand);color:var(--brand-ink);font:500 12px/22px var(--f-mono);text-align:center}
.who{font:500 12px var(--f-mono);color:var(--ink-2);padding:0 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border:1px solid var(--edge);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{background:var(--brand);border-color:var(--brand-edge);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--brand-edge)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger-bg-ink)}
.btn.ghost{border-color:transparent;background:none}
.linkish{background:none;border:0;padding:12px 0;min-height:44px;color:var(--brand-text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;font-weight:500}

/* hero: cutting mat with the corgi sitting on it */
.hero{position:relative;overflow:hidden;border-radius:16px;color:var(--mat-ink);background-color:var(--mat);
  background-image:linear-gradient(var(--mat-grid-a) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid-a) 1px,transparent 1px),linear-gradient(var(--mat-grid-b) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid-b) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}
.hero::before,.hero::after{content:"";position:absolute;left:0;right:0;top:0;pointer-events:none}
.hero::before{height:7px;background:repeating-linear-gradient(90deg,var(--mat-tick) 0 1px,transparent 1px 12px)}
.hero::after{height:14px;background:repeating-linear-gradient(90deg,var(--mat-tick) 0 1px,transparent 1px 60px)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end;padding:48px clamp(18px,4vw,40px) 0}
.hero-copy{padding-bottom:28px;max-width:640px;min-width:0}
.hero-corgi{width:clamp(180px,24vw,250px);height:auto;display:block;margin-bottom:-1px}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.hero-corgi{display:none}}
.mono-label{font:500 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;margin:0 0 10px}
.hero .mono-label{color:var(--mat-ink-2)}
.hero h1{font:700 clamp(30px,5.2vw,48px)/1.04 var(--f-display);letter-spacing:-.03em;margin:0 0 20px;text-wrap:balance}
.search{display:flex;gap:8px;max-width:540px}
.search input{flex:1;min-width:0;height:48px;padding:0 14px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
.search input::placeholder{color:var(--ink-2)}
.search button{height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--mat-ink);color:var(--mat-deep);font-weight:600;cursor:pointer}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;color:var(--mat-ink)}
.hero-steps{list-style:none;display:flex;flex-wrap:wrap;gap:6px 22px;margin:20px 0 0;padding:0;font:500 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mat-ink-2)}
.hero-steps b{color:var(--mat-ink);margin-right:6px}
.tally{margin:12px 0 0;font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mat-ink-2)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-block:24px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{min-height:44px;border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font:400 11px var(--f-mono);margin-left:6px;opacity:.8}
.selects{display:flex;flex-wrap:wrap;gap:10px}
.sel{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
select,input[type=text],input[type=email],input[type=password],input[type=number],textarea{border:1px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
select:hover,input:hover,textarea:hover{border-color:var(--ink-2)}
.sel select{width:auto;font-size:15px;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.count{margin:10px 0 14px;color:var(--ink-2);font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}

/* cards */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:16px}
.grid>li{min-width:0}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;min-width:0;width:100%;height:100%}
.card:hover{border-color:var(--ink-2)}
.card[data-preview]{pointer-events:none}
.card.dim .thumb{opacity:.7}
.thumb{position:relative;display:block;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tile{display:grid;place-items:center;width:100%;height:100%;
  color:color-mix(in oklch,var(--c) 60%,var(--ink));
  background-color:color-mix(in oklch,var(--c) 20%,var(--surface));
  background-image:repeating-linear-gradient(135deg,color-mix(in oklch,var(--c) 16%,transparent) 0 1px,transparent 1px 11px)}
.tile svg{width:36%;max-width:84px;height:auto}
.flag{position:absolute;left:10px;top:10px;padding:3px 8px;border-radius:6px;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn)}
.cbody{display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;min-width:0}
.kicker{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ctitle{font:600 18px/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.cmeta{color:var(--ink-2);font-size:14px}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.where{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font:500 12px/1.5 var(--f-mono);white-space:nowrap}
.pill.give,.pill.accepted,.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.swap{background:var(--swap-soft);color:var(--swap)}
.pill.open,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.own{background:var(--brand-soft);color:var(--brand-text)}
.pill.declined,.pill.cancelled,.pill.gone{background:var(--muted-soft);color:var(--ink-2)}
.empty{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;border:1px dashed var(--edge);border-radius:16px;padding:28px 24px;color:var(--ink-2)}
.empty-corgi{width:84px;height:84px;flex:none;transform:rotate(-7deg)}
.empty>div{flex:1;min-width:min(100%,240px)}
.empty-t{font:600 20px/1.2 var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 0 14px;max-width:48ch}

/* pages */
.h2{font:700 clamp(26px,4vw,34px)/1.1 var(--f-display);letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--ink-2);margin:0 0 24px;max-width:56ch}
.fine{color:var(--ink-2);font-size:14px;margin:12px 0 0}
.note{color:var(--ink-2);margin:0 0 10px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:15px}
.field .hint{font-size:14px;color:var(--ink-2);font-weight:400}
.field-err{margin:0;color:var(--danger);font-weight:500;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px}
.qty{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
textarea{resize:vertical;min-height:88px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-opt{position:relative}
.seg-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg-opt span{display:flex;align-items:center;min-height:44px;padding:8px 18px;border:1px solid var(--edge);border-radius:10px;background:var(--surface);font-weight:600;font-size:15px}
.seg-opt input:checked+span{background:var(--brand-soft);border-color:var(--brand-edge);color:var(--brand-text);box-shadow:inset 0 0 0 1px var(--brand-edge)}
.seg-opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;border:1px dashed var(--ink-2);border-radius:12px;cursor:pointer;background:var(--surface)}
.drop:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.drop .btn{pointer-events:none}
.post-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:36px;align-items:start}
.post-grid form{max-width:620px}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media(max-width:860px){.post-grid{grid-template-columns:1fr}.preview{position:static;max-width:320px}}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:48px;align-items:start;max-width:940px}
@media(max-width:780px){.auth{grid-template-columns:1fr;gap:32px}}
.auth-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:24px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);margin:14px 0 18px}
.tabs button{flex:1;min-height:44px;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--edge)}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-2);font:500 12px var(--f-mono);text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.steps b{font:500 13px var(--f-mono);color:var(--brand-text);padding-top:3px}
.steps h2{font:600 18px var(--f-display);margin:0 0 2px}
.steps p{margin:0;color:var(--ink-2)}

/* pictures */
.art{display:block;width:100%;height:100%}
.art svg{display:block;width:100%;height:100%}

/* messages */
.av{display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:oklch(80% .09 var(--h,60));color:oklch(26% .06 var(--h,60));font:600 calc(var(--s,40px)*.38)/1 var(--f-body);flex:none}
.inbox{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:16px;align-items:start}
.list-col,.panel-col{min-width:0}
.tabs.sm{margin:0 0 10px}
.threads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.thread{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:0 16px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:transparent;cursor:pointer}
.thread:hover{background:var(--surface-2)}
.thread[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand-edge)}
.thumbav{position:relative;display:block;width:52px;height:52px}
.mini{display:block;width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--surface-2);flex:none}
.thumbav .av{position:absolute;right:-8px;bottom:-8px;--s:26px;border:2px solid var(--bg)}
.tbody{display:flex;flex-direction:column;min-width:0;gap:1px}
.t1{font:600 16px/1.25 var(--f-display)}
.t1b{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:400 12px var(--f-mono);color:var(--ink-2)}
.thread.unread .t1,.thread.unread .t2{color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand-edge)}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--surface);min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ptitle{font:600 18px/1.2 var(--f-display)}
.psub{font-size:14px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.back{display:none}
@media(max-width:760px){.inbox{grid-template-columns:1fr}.inbox[data-active="true"] .list-col{display:none}.inbox[data-active="false"] .panel-col{display:none}.back{display:inline-flex}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.banner .mini{width:56px;height:56px}
.banner-body{flex:1;min-width:170px}
.banner-body .linkish{padding:0;min-height:0;font:600 16px/1.25 var(--f-display);color:var(--ink);text-decoration:none}
.banner-body .linkish:hover{text-decoration:underline}
.banner-actions{display:flex;flex-wrap:wrap;gap:8px}
.msgs{padding:16px;display:flex;flex-direction:column;gap:6px;height:min(52vh,460px);min-height:220px;overflow:auto}
.msg{max-width:78%;padding:9px 14px;border-radius:18px;background:var(--surface-2);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.msg:not(.me):not(.sys){border-bottom-left-radius:6px}
.msg small{display:block;margin-top:2px;font:400 11px var(--f-mono);opacity:.75}
.msg.sys{align-self:center;max-width:100%;background:none;text-align:center;font:500 12px var(--f-mono);color:var(--ink-2);padding:6px}
.typing{align-self:flex-start;display:inline-flex;gap:5px;padding:13px 16px;border-radius:18px;border-bottom-left-radius:6px;background:var(--surface-2)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);display:block;opacity:.6}
@media (prefers-reduced-motion:no-preference){.typing i{animation:blink 1.2s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.contact{margin:0;padding:10px 16px;background:var(--ok-soft);color:var(--ink);border-top:1px solid var(--line);font-size:15px}
.contact span{font-family:var(--f-mono);user-select:all}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px}
.quick button{min-height:44px;padding:6px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.quick button:hover{border-color:var(--ink)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 16px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;min-height:48px;max-height:140px;border-radius:24px;padding:12px 16px;resize:none}
.composer .btn{border-radius:24px;min-height:48px;padding:8px 20px}
.closed-note{margin:0;padding:14px 16px;border-top:1px solid var(--line);color:var(--ink-2)}
.panel-empty{margin:auto;padding:40px 24px;text-align:center;color:var(--ink-2);max-width:36ch}
.panel-empty svg{width:96px;height:96px;transform:rotate(-7deg);margin:0 auto 12px;display:block}
.msgbox{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.msgbox .quick{padding:0 0 12px}

/* detail dialog */
dialog#detail{padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);
  width:min(900px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));max-width:none;max-height:calc(100dvh - 32px);overflow:auto}
dialog#detail:modal{overscroll-behavior:contain}
dialog#detail::backdrop{background:color-mix(in oklch,var(--ink) 55%,transparent);overflow:hidden;overscroll-behavior:contain}
.sheet{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media(max-width:720px){.sheet{grid-template-columns:1fr}}
.sheet-media{min-height:260px;background:var(--surface-2)}
.sheet-media img{width:100%;height:100%;object-fit:cover;display:block;max-height:520px}
.sheet-body{padding:24px;min-width:0}
.sheet h2{font:700 27px/1.12 var(--f-display);letter-spacing:-.02em;margin:6px 48px 12px 0;overflow-wrap:anywhere}
.close{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--surface);cursor:pointer;font-size:22px;line-height:1;z-index:2}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0}
.facts div{min-width:0}
.facts .wide{grid-column:1/-1}
.facts dt{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:2px 0 0;overflow-wrap:anywhere}
.desc{margin:0 0 18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{border:1px solid var(--edge);border-radius:14px;padding:16px;background:var(--surface-2)}
.confirm-t{font:600 18px/1.25 var(--f-display);margin:0 0 4px}
.confirm-d{margin:0 0 12px;color:var(--ink-2)}

/* footer + toast */
.foot{border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}
.foot .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center}
.foot p{margin:0}
.foot-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip,.thread,.nav-btn{transition:border-color .15s,background-color .15s}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (forced-colors:active){.btn.primary,.chip[aria-pressed="true"],.nav-btn[aria-current="page"]{border:2px solid ButtonText}}
</style>
</head>

function hash(s){
  var txt='scrappy:'+s;
  try{var b=new TextEncoder().encode(txt);return crypto.subtle.digest('SHA-256',b).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}

/* sample neighbors answer so the demo feels two-way */
function isSample(id){return /^u_/.test(id);}
function replyText(l,fromId,text){
  var t=String(text).toLowerCase(), who=me()?first(me()):'there', seller=l.ownerId===fromId;
  if(seller){
    if(/thank|thx/.test(t))return 'You’re welcome! Enjoy making things.';
    if(/swap|trade|have something/.test(t))return 'I’m open to it. '+(l.wanted?'I’m hoping for '+l.wanted.toLowerCase()+', but send a photo of what you have.':'Send me a photo of what you have.');
    if(/when|pick|today|tomorrow|weekend|saturday|sunday|evening|morning|after 5/.test(t))return 'That works. I’m usually home after 5 on weekdays and most of the weekend.';
    if(/some|part|half|just|only/.test(t))return 'Sure, take what you need.';
    if(/still|available|avail|interested/.test(t))return 'Hi '+who+'! Yes, it’s still available.'+(l.mode==='swap'?' What would you like to swap?':' When could you pick it up?');
    if(/taken|sorry/.test(t))return null;
    return 'Happy to help. What would you like to know?';
  }
  if(/thank|thx/.test(t))return 'Thank you!';
  if(/after 5|pickup|pick up|porch|home|when/.test(t))return 'Perfect. Saturday morning works for me. Is 10 okay?';
  if(/still|available|yes/.test(t))return 'Great! I can pick up this weekend if that works.';
  if(/taken|sorry/.test(t))return 'No problem, thanks for letting me know.';
  if(/hold|holding/.test(t))return 'Thank you! I’ll be there.';
  return 'Sounds good. Thanks!';
}
function maybeAutoReply(c,text){
  var u=me();if(!u)return;
  var l=listingOf(c.listingId);if(!l)return;
  var otherId=l.ownerId===u.id?c.buyerId:l.ownerId;
  if(!isSample(otherId)||c.status==='done'||c.status==='closed')return;
  typing[c.id]=otherId;refreshOpen(c.id);
  setTimeout(function(){
    delete typing[c.id];
    var cu=me(), reply=cu&&replyText(l,otherId,text);
    if(!reply){refreshOpen(c.id);return;}
    c.messages.push({from:otherId,text:reply,t:Date.now()});
    if(state.view==='messages'&&state.activeChat===c.id)c.read[cu.id]=Date.now();
    save();refreshOpen(c.id);renderHeader();
  },1500+Math.random()*900);
}
function refreshOpen(id){
  if(state.view!=='messages')return;
  renderList();
  if(state.activeChat===id){renderMsgs();renderQuick();}
}

    case 'auth-tab':state.authTab=el.dataset.tab;viewJoin();break;
    case 'demo':setSession('u_sam');if(!me()){db=seed();save();setSession('u_sam');}toast('Logged in as Sam Rivera (demo).');afterAuth();break;
    case 'login-prompt':{var id=state.detail;closeDetail();state.after=function(){openDetail(id);};state.authTab='signup';state.joinNote='Join or log in to send a message.';go('join');break;}
    case 'chat-tab':state.msgTab=el.dataset.tab;renderList();break;
    case 'chat-open':{
      var cc=chatOf(el.dataset.id);if(!cc)break;
      state.activeChat=cc.id;markRead(cc,u);renderHeader();renderList();renderPanel();
      var mb=$('#msgs');if(mb)mb.focus({preventScroll:true});break;}
    case 'chat-back':state.activeChat=null;renderList();renderPanel();break;
    case 'chat-hold':chatAction('hold');break;
    case 'chat-release':chatAction('release');break;
    case 'chat-done':chatAction('done');break;
    case 'quick-reply':{var c2=chatOf(state.activeChat);if(c2)sendMsg(c2,el.dataset.text);var ta=$('#m-text');if(ta)ta.focus();break;}
    case 'quick-start':startChat(listingOf(state.detail),el.dataset.text);break;
    case 'goto-messages':closeDetail();state.msgTab='giving';state.activeChat=null;go('messages');break;
    case 'goto-thread':{var cx=chatOf(el.dataset.id);closeDetail();if(cx){state.msgTab='all';state.activeChat=cx.id;}go('messages');break;}
    case 'ask-gone':askConfirm('gone');break;
    case 'ask-delete':askConfirm('delete');break;
    case 'cancel-confirm':{var b=$('#confirmBox',dlg),ac=$('#ownerActs',dlg);b.hidden=true;ac.hidden=false;var f1=$('button',ac);if(f1)f1.focus();break;}
    case 'do-gone':{
      var l2=listingOf(state.detail);if(!l2)break;
      l2.status='gone';closeOthers(l2,null,'This item is no longer available.');
      save();closeDetail();render();toast('Marked as gone. It no longer shows on Browse.');break;}
    case 'do-delete':{
      var id2=state.detail;db.listings=db.listings.filter(function(x){return x.id!==id2;});db.chats=db.chats.filter(function(x){return x.listingId!==id2;});
      save();closeDetail();render();toast('Listing deleted.');break;}
    case 'photo-remove':postPhoto=null;renderPhotoBox();updatePreview();break;
    case 'ask-reset':state.resetAsk=true;renderFooter();{var kb=$('[data-action=cancel-reset]');if(kb)kb.focus();}break;
    case 'cancel-reset':state.resetAsk=false;renderFooter();{var rb=$('[data-action=ask-reset]');if(rb)rb.focus();}break;
    case 'do-reset':
      db=seed();save();setSession(null);state.resetAsk=false;state.filters={q:'',cat:'all',mode:'any',area:'any'};state.activeChat=null;typing={};closeDetail();renderFooter();go('browse');toast('Sample data restored. You’re logged out.');break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();
  switch(f.dataset.form){
    case 'auth':submitAuth();break;
    case 'post':submitPost();break;
    case 'startchat':submitStart();break;
    case 'msg':submitMsg();break;
  }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&t&&(t.id==='m-text'||t.id==='d-msg')){
    e.preventDefault();var f=t.form;
    if(f){if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){state.filters.q=t.value;updateBrowse();return;}
  if(t.getAttribute&&t.getAttribute('aria-invalid')==='true'&&t.id)setErr(t.id,'');
  if(t.closest&&t.closest('#postForm'))updatePreview();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-mode'){state.filters.mode=t.value;updateBrowse();}
  else if(t.id==='f-area'){state.filters.area=t.value;updateBrowse();}
  else if(t.id==='p-photo'&&t.files&&t.files[0]){
    readPhoto(t.files[0]).then(function(d){postPhoto=d;setErr('p-photo','');renderPhotoBox();updatePreview();}).catch(function(){setErr('p-photo','That file couldn’t be read as an image. Try a JPG or PNG.');});
  }else if(t.closest&&t.closest('#postForm'))updatePreview();
});

renderFooter();
if(state.view==='post'||state.view==='messages'){go(state.view);}else render();
})();
</script>

</body>
</html>
